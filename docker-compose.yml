services:
  postgres:
    image: postgres:16-alpine
    container_name: canchas-postgres
    environment:
      POSTGRES_DB: canchas
      POSTGRES_USER: canchas
      POSTGRES_PASSWORD: canchas_dev
    ports:
      - "5432:5432"
    volumes:
      - canchas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas -d canchas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  canchas_pgdata:
