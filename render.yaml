# Blueprint Render: PostgreSQL + API Spring Boot + frontend estático (Vite/React).
# Docs: https://render.com/docs/blueprint-spec
#
# Después de conectar el repo en Render → New → Blueprint → seleccionar este archivo.
# Los nombres de servicio definen las URLs: https://<name>.onrender.com

databases:
  - name: canchas-db
    plan: free
    databaseName: canchas
    user: canchas

services:
  # --- API Spring Boot (Java vía Docker; Render no tiene runtime java nativo) ---
  - type: web
    name: canchas-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: canchas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: canchas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: canchas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: canchas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: canchas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "120"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: canchas-web
          envVarKey: RENDER_EXTERNAL_URL

  # --- Frontend React (sitio estático; sin plan: los static sites son gratis por defecto) ---
  - type: web
    name: canchas-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy de /api al backend (misma URL en el navegador, sin CORS en dev/prod web)
      - type: rewrite
        source: /api/*
        destination: https://canchas-api.onrender.com/api/*
      # SPA: React Router
      - type: rewrite
        source: /*
        destination: /index.html
