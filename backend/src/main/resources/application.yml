spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: canchas-api
  jackson:
    time-zone: America/Bogota
  datasource:
    url: jdbc:postgresql://localhost:5432/canchas
    username: canchas
    password: canchas_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: "http://localhost:5173"
