spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: canchas-api
  jackson:
    time-zone: America/Bogota
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:canchas}
    username: ${DB_USER:canchas}
    password: ${DB_PASSWORD:canchas_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-local-env-change-me-in-local-env}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
